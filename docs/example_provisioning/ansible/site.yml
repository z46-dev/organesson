---
- name: Apply idempotent Linux guest configuration
  hosts: fedora_server
  become: true
  gather_facts: true
  tasks:
    - name: Ensure QEMU guest agent is enabled
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Mark the server ready for its next lifecycle step
      ansible.builtin.file:
        path: /var/lib/organesson-ready
        state: touch
        mode: "0644"
