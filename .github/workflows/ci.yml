name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(find backend provider -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Linux template prep script syntax
        run: bash -n public/scripts/template-prep/linux/og-prep-linux.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test frontend route access
        run: bun run test

      - name: Build
        run: bun run build

  backend-security:
    name: Backend vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan Go dependencies and reachable code
        run: govulncheck ./...

  frontend-security:
    name: Frontend dependency scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan frontend dependencies
        run: bun audit --audit-level high

  tofu-examples:
    name: OpenTofu example validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.5
          tofu_wrapper: false

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive examples/test_project examples/artifact_smoke

      - name: Build local provider
        run: |
          mkdir -p .bin
          go build -o .bin/terraform-provider-organesson ./provider

      - name: Validate test project against local provider schema
        run: |
          cli_config="$RUNNER_TEMP/organesson-tofu.rc"
          sed "s|REPOSITORY_ROOT|$GITHUB_WORKSPACE|g" examples/test_project/tofu.rc.example > "$cli_config"
          export TF_CLI_CONFIG_FILE="$cli_config"
          export ORGANESSON_ENDPOINT="http://127.0.0.1:6800"
          export ORGANESSON_TOKEN="ci-validation-only"
          tofu -chdir=examples/test_project validate
          tofu -chdir=examples/artifact_smoke validate
